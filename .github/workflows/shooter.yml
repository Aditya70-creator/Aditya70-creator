name: Generate Contribution Shooter

on:
  schedule:
    - cron: "0 0 * * *" # Roj raat ko run hoga
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate Pacman/Shooter
        uses: abozanona/pacman-contribution-graph@v1 # Ya koi similar action
        with:
          github_user_name: ${{ github.repository_owner }}
          output_svg_path: dist/shooter.svg
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
