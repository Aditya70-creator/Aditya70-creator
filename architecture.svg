<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .sec-title { font: 700 13px 'JetBrains Mono', Consolas, monospace; fill: #00E7FF; letter-spacing: 2px; }
      .node-title { font: 700 13px 'Segoe UI', Roboto, sans-serif; fill: #ffffff; }
      .node-sub { font: 500 10.5px 'JetBrains Mono', Consolas, monospace; fill: #94a3b8; }
      .pipe-base { stroke: #1e293b; stroke-width: 3; fill: none; }
      .pipe-flow { stroke: #00E7FF; stroke-width: 3; fill: none; stroke-dasharray: 10 35; animation: flow 1.6s linear infinite; }
      .pipe-flow-purple { stroke: #a855f7; stroke-width: 3; fill: none; stroke-dasharray: 10 35; animation: flow 1.6s linear infinite; }
      .node-box { fill: url(#cardBg); stroke-width: 1.8; rx: 10px; }
      .pulse-dot { animation: pulseDot 2s infinite ease-in-out; }
      @keyframes flow { from { stroke-dashoffset: 90; } to { stroke-dashoffset: 0; } }
      @keyframes pulseDot { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1000" height="260" rx="14" fill="#060a12" stroke="#1e293b" stroke-width="1.5" />

  <!-- TRACK 1: PRODUCTION BACKEND ARCHITECTURE -->
  <text x="30" y="32" class="sec-title">01 // SPRING BOOT BACKEND REQUEST PIPELINE</text>

  <!-- Animated Connector Lines Track 1 -->
  <line x1="180" y1="82" x2="820" y2="82" class="pipe-base" />
  <line x1="180" y1="82" x2="820" y2="82" class="pipe-flow" filter="url(#glow)" />

  <!-- Box 1: Client -->
  <g transform="translate(30, 48)">
    <rect width="155" height="68" class="node-box" stroke="#38bdf8" />
    <circle cx="18" cy="20" r="4" fill="#38bdf8" class="pulse-dot" />
    <text x="30" y="24" class="node-title">Client / REST</text>
    <text x="18" y="44" class="node-sub">HTTP / JSON Payload</text>
    <text x="18" y="58" class="node-sub">React / Postman</text>
  </g>

  <!-- Box 2: Security -->
  <g transform="translate(235, 48)">
    <rect width="165" height="68" class="node-box" stroke="#8b5cf6" />
    <circle cx="18" cy="20" r="4" fill="#8b5cf6" class="pulse-dot" />
    <text x="30" y="24" class="node-title">Spring Security</text>
    <text x="18" y="44" class="node-sub">JWT Filter + RBAC</text>
    <text x="18" y="58" class="node-sub">Request Validation</text>
  </g>

  <!-- Box 3: Service Layer -->
  <g transform="translate(450, 48)">
    <rect width="165" height="68" class="node-box" stroke="#00E7FF" />
    <circle cx="18" cy="20" r="4" fill="#00E7FF" class="pulse-dot" />
    <text x="30" y="24" class="node-title">Service Layer</text>
    <text x="18" y="44" class="node-sub">Spring Boot 3 Core</text>
    <text x="18" y="58" class="node-sub">Business Logic + TX</text>
  </g>

  <!-- Box 4: JPA / ORM -->
  <g transform="translate(665, 48)">
    <rect width="145" height="68" class="node-box" stroke="#3b82f6" />
    <circle cx="18" cy="20" r="4" fill="#3b82f6" class="pulse-dot" />
    <text x="30" y="24" class="node-title">JPA / Hibernate</text>
    <text x="18" y="44" class="node-sub">ORM Mapping</text>
    <text x="18" y="58" class="node-sub">Query Optimization</text>
  </g>

  <!-- Box 5: Database -->
  <g transform="translate(845, 48)">
    <rect width="125" height="68" class="node-box" stroke="#10b981" />
    <circle cx="18" cy="20" r="4" fill="#10b981" class="pulse-dot" />
    <text x="30" y="24" class="node-title">ACID Storage</text>
    <text x="18" y="44" class="node-sub">MySQL 8.0</text>
    <text x="18" y="58" class="node-sub">PostgreSQL</text>
  </g>

  <!-- TRACK 2: OPEN SOURCE & ENGINEERING WORKFLOW -->
  <text x="30" y="158" class="sec-title" fill="#a855f7">02 // OPEN SOURCE, DSA + DEPLOYMENT WORKFLOW</text>

  <!-- Animated Connector Lines Track 2 -->
  <line x1="180" y1="205" x2="820" y2="205" class="pipe-base" />
  <line x1="180" y1="205" x2="820" y2="205" class="pipe-flow-purple" filter="url(#glow)" />

  <!-- OS 1 -->
  <g transform="translate(30, 172)">
    <rect width="205" height="66" class="node-box" stroke="#f59e0b" />
    <text x="18" y="24" class="node-title">1. DSA + Problem Solving</text>
    <text x="18" y="44" class="node-sub">Java • 250+ LeetCode Target</text>
    <text x="18" y="58" class="node-sub">Time + Space Optimization</text>
  </g>

  <!-- OS 2 -->
  <g transform="translate(285, 172)">
    <rect width="205" height="66" class="node-box" stroke="#a855f7" />
    <text x="18" y="24" class="node-title">2. Git + Apache Open Source</text>
    <text x="18" y="44" class="node-sub">Issue Triage • Apache Grails</text>
    <text x="18" y="58" class="node-sub">Clean PRs + Code Reviews</text>
  </g>

  <!-- OS 3 -->
  <g transform="translate(540, 172)">
    <rect width="205" height="66" class="node-box" stroke="#00E7FF" />
    <text x="18" y="24" class="node-title">3. Containerized Build</text>
    <text x="18" y="44" class="node-sub">Maven • Docker • Linux</text>
    <text x="18" y="58" class="node-sub">Automated Unit Testing</text>
  </g>

  <!-- OS 4 -->
  <g transform="translate(795, 172)">
    <rect width="175" height="66" class="node-box" stroke="#10b981" />
    <text x="18" y="24" class="node-title">4. GSoC + Prod Ready</text>
    <text x="18" y="44" class="node-sub">Scalable Microservices</text>
    <text x="18" y="58" class="node-sub">High Availability</text>
  </g>
</svg>