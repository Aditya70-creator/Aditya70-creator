<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 235" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070f" />
      <stop offset="50%" stop-color="#091022" />
      <stop offset="100%" stop-color="#04070f" />
    </linearGradient>

    <linearGradient id="topNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#00E7FF" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Base Contribution Grid Pattern -->
    <pattern id="contribGrid" x="250" y="58" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="13" height="13" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    </pattern>

    <style>
      .hud-title { font: 700 12px 'JetBrains Mono', Consolas, monospace; fill: #00E7FF; letter-spacing: 2px; }
      .hud-score { font: 700 12px 'JetBrains Mono', Consolas, monospace; fill: #34d399; letter-spacing: 1.5px; }
      .hud-sub { font: 600 11px 'JetBrains Mono', Consolas, monospace; fill: #94a3b8; }

      /* Rocket Patrol Animation (Left-to-Right + Vertical Strafe) */
      .ship-patrol {
        animation: patrolX 7s ease-in-out infinite alternate, strafeY 2.4s ease-in-out infinite alternate;
      }

      /* Rapid Fire Laser Beams */
      .laser-1 { animation: fireLaser 0.7s linear infinite; }
      .laser-2 { animation: fireLaser 0.7s linear 0.35s infinite; }

      /* Engine Thruster Flicker */
      .thruster { animation: thrust 0.25s ease-in-out infinite alternate; }

      /* Target Contribution Blocks Getting Blasted */
      .blk-1 { animation: blastBlock 3.5s infinite 0.4s; }
      .blk-2 { animation: blastBlock 3.5s infinite 1.1s; }
      .blk-3 { animation: blastBlock 3.5s infinite 1.8s; }
      .blk-4 { animation: blastBlock 3.5s infinite 2.5s; }
      .blk-5 { animation: blastBlock 3.5s infinite 3.1s; }

      @keyframes patrolX {
        0% { transform: translateX(0px) translateY(0px); }
        25% { transform: translateX(180px) translateY(36px); }
        50% { transform: translateX(360px) translateY(-18px); }
        75% { transform: translateX(540px) translateY(36px); }
        100% { transform: translateX(700px) translateY(0px); }
      }

      @keyframes fireLaser {
        0% { transform: translateX(0px); opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(320px); opacity: 0; }
      }

      @keyframes thrust {
        0% { opacity: 0.65; transform: scaleX(0.85); }
        100% { opacity: 1; transform: scaleX(1.18); }
      }

      @keyframes blastBlock {
        0%, 40% { opacity: 1; fill: #10b981; }
        45% { opacity: 1; fill: #00E7FF; filter: url(#neonGlow); }
        55%, 85% { opacity: 0.08; fill: #ef4444; }
        100% { opacity: 1; fill: #10b981; }
      }
    </style>
  </defs>

  <!-- Outer Space Arcade Frame -->
  <rect width="1100" height="235" rx="16" fill="url(#spaceBg)" stroke="#1e293b" stroke-width="1.8" />
  <rect x="2" y="0" width="1096" height="3.5" rx="2" fill="url(#topNeon)" />

  <!-- Top Arcade HUD Bar -->
  <circle cx="28" cy="26" r="4.5" fill="#00E7FF" filter="url(#neonGlow)" />
  <text x="42" y="30" class="hud-title">CONTRIBUTION BLASTER // COMMIT DESTROYER v2.0</text>
  <text x="580" y="30" class="hud-sub">PILOT: ADITYA_MITRA</text>
  <text x="830" y="30" class="hud-score">STATUS: BLASTING COMMITS [ACTIVE]</text>
  <line x1="20" y1="44" x2="1080" y2="44" stroke="#1e293b" stroke-width="1.2" />

  <!-- Background Contribution Matrix (52 Weeks x 7 Days) -->
  <rect x="126" y="58" width="936" height="126" fill="url(#contribGrid)" />

  <!-- Active Green/Cyan/Purple Contribution Nodes Being Targeted -->
  <g transform="translate(126, 58)">
    <!-- Row 1 Targets -->
    <rect x="182" y="2" width="13" height="13" rx="3" fill="#059669" />
    <rect x="218" y="2" width="13" height="13" rx="3" class="blk-1" />
    <rect x="290" y="2" width="13" height="13" rx="3" fill="#10b981" />
    <rect x="362" y="2" width="13" height="13" rx="3" class="blk-2" />
    <rect x="452" y="2" width="13" height="13" rx="3" fill="#34d399" />
    <rect x="542" y="2" width="13" height="13" rx="3" class="blk-3" />
    <rect x="650" y="2" width="13" height="13" rx="3" fill="#059669" />
    <rect x="740" y="2" width="13" height="13" rx="3" class="blk-4" />
    <rect x="830" y="2" width="13" height="13" rx="3" fill="#10b981" />
    <rect x="902" y="2" width="13" height="13" rx="3" class="blk-5" />

    <!-- Row 2 Targets -->
    <rect x="164" y="20" width="13" height="13" rx="3" class="blk-2" />
    <rect x="254" y="20" width="13" height="13" rx="3" fill="#059669" />
    <rect x="326" y="20" width="13" height="13" rx="3" class="blk-3" />
    <rect x="416" y="20" width="13" height="13" rx="3" fill="#10b981" />
    <rect x="506" y="20" width="13" height="13" rx="3" class="blk-4" />
    <rect x="596" y="20" width="13" height="13" rx="3" fill="#34d399" />
    <rect x="686" y="20" width="13" height="13" rx="3" class="blk-5" />
    <rect x="776" y="20" width="13" height="13" rx="3" fill="#10b981" />
    <rect x="866" y="20" width="13" height="13" rx="3" class="blk-1" />

    <!-- Row 3 Targets (Center Line) -->
    <rect x="146" y="38" width="13" height="13" rx="3" fill="#10b981" />
    <rect x="200" y="38" width="13" height="13" rx="3" class="blk-1" />
    <rect x="272" y="38" width="13" height="13" rx="3" class="blk-2" />
    <rect x="344" y="38" width="13" height="13" rx="3" fill="#34d399" />
    <rect x="398" y="38" width="13" height="13" rx="3" class="blk-3" />
    <rect x="470" y="38" width="13" height="13" rx="3" fill="#059669" />
    <rect x="524" y="38" width="13" height="13" rx="3" class="blk-4" />
    <rect x="614" y="38" width="13" height="13" rx="3" class="blk-5" />
    <rect x="704" y="38" width="13" height="13" rx="3" fill="#10b981" />
    <rect x="794" y="38" width="13" height="13" rx="3" class="blk-2" />
    <rect x="884" y="38" width="13" height="13" rx="3" class="blk-3" />

    <!-- Row 4 Targets -->
    <rect x="182" y="56" width="13" height="13" rx="3" class="blk-3" />
    <rect x="236" y="56" width="13" height="13" rx="3" fill="#059669" />
    <rect x="308" y="56" width="13" height="13" rx="3" class="blk-4" />
    <rect x="380" y="56" width="13" height="13" rx="3" fill="#10b981" />
    <rect x="434" y="56" width="13" height="13" rx="3" class="blk-5" />
    <rect x="560" y="56" width="13" height="13" rx="3" class="blk-1" />
    <rect x="632" y="56" width="13" height="13" rx="3" fill="#34d399" />
    <rect x="722" y="56" width="13" height="13" rx="3" class="blk-2" />
    <rect x="812" y="56" width="13" height="13" rx="3" fill="#059669" />
    <rect x="902" y="56" width="13" height="13" rx="3" class="blk-4" />

    <!-- Row 5 Targets -->
    <rect x="164" y="74" width="13" height="13" rx="3" fill="#059669" />
    <rect x="254" y="74" width="13" height="13" rx="3" class="blk-2" />
    <rect x="344" y="74" width="13" height="13" rx="3" class="blk-5" />
    <rect x="452" y="74" width="13" height="13" rx="3" fill="#10b981" />
    <rect x="524" y="74" width="13" height="13" rx="3" class="blk-3" />
    <rect x="614" y="74" width="13" height="13" rx="3" fill="#059669" />
    <rect x="686" y="74" width="13" height="13" rx="3" class="blk-1" />
    <rect x="776" y="74" width="13" height="13" rx="3" class="blk-4" />
    <rect x="848" y="74" width="13" height="13" rx="3" fill="#34d399" />

    <!-- Row 6 Targets -->
    <rect x="200" y="92" width="13" height="13" rx="3" class="blk-4" />
    <rect x="290" y="92" width="13" height="13" rx="3" fill="#10b981" />
    <rect x="380" y="92" width="13" height="13" rx="3" class="blk-1" />
    <rect x="488" y="92" width="13" height="13" rx="3" class="blk-2" />
    <rect x="578" y="92" width="13" height="13" rx="3" fill="#34d399" />
    <rect x="668" y="92" width="13" height="13" rx="3" class="blk-3" />
    <rect x="758" y="92" width="13" height="13" rx="3" fill="#059669" />
    <rect x="866" y="92" width="13" height="13" rx="3" class="blk-5" />
  </g>

  <!-- ========================================================= -->
  <!-- ANIMATED ROCKET SPACESHIP + DUAL LASER CANNONS            -->
  <!-- ========================================================= -->
  <g transform="translate(55, 102)">
    <g class="ship-patrol">

      <!-- Laser Bolts Shooting Right -->
      <rect x="58" y="-3" width="38" height="3.5" rx="1.5" fill="#00E7FF" filter="url(#neonGlow)" class="laser-1" />
      <rect x="58" y="4" width="38" height="3.5" rx="1.5" fill="#c084fc" filter="url(#neonGlow)" class="laser-2" />

      <!-- Rocket Thruster Flame -->
      <polygon points="-28,2 -4,-5 -4,9" fill="url(#flameGrad)" filter="url(#neonGlow)" class="thruster" />

      <!-- Spaceship Wings -->
      <polygon points="-4,-18 24,0 -4,18" fill="#1e293b" stroke="#3B82F6" stroke-width="1.5" />
      <!-- Spaceship Fuselage -->
      <polygon points="-6,-10 46,2 -6,14" fill="#0f172a" stroke="#00E7FF" stroke-width="2" filter="url(#neonGlow)" />
      <!-- Cockpit Canopy -->
      <ellipse cx="14" cy="2" rx="9" ry="4" fill="#00E7FF" />
      <!-- Wingtip Cannons -->
      <rect x="16" y="-12" width="14" height="3" rx="1" fill="#8B5CF6" />
      <rect x="16" y="13" width="14" height="3" rx="1" fill="#8B5CF6" />
    </g>
  </g>

  <!-- Bottom Legend Bar -->
  <text x="28" y="214" class="hud-sub">MODE: AUTONOMOUS LASER SWEEP</text>
  <g transform="translate(855, 202)">
    <text x="0" y="11" class="hud-sub">LESS</text>
    <rect x="38" y="0" width="12" height="12" rx="2.5" fill="#0f172a" stroke="#1e293b" />
    <rect x="55" y="0" width="12" height="12" rx="2.5" fill="#064e3b" />
    <rect x="72" y="0" width="12" height="12" rx="2.5" fill="#059669" />
    <rect x="89" y="0" width="12" height="12" rx="2.5" fill="#10b981" />
    <rect x="106" y="0" width="12" height="12" rx="2.5" fill="#00E7FF" />
    <text x="126" y="11" class="hud-sub">BLASTED</text>
  </g>
</svg>