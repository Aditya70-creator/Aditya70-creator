<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1124" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00E7FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <style>
      .name { font: 800 52px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 5px; }
      .name-accent { fill: url(#textGrad); }
      .role { font: 700 15px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #00E7FF; letter-spacing: 3.5px; }
      .sub { font: 400 14px 'Segoe UI', -apple-system, Roboto, sans-serif; fill: #94a3b8; letter-spacing: 1px; }
      .term-text { font: 500 11.5px 'JetBrains Mono', Consolas, monospace; }
      .pill { fill: #0f172a; stroke: #00E7FF; stroke-width: 1.2; stroke-opacity: 0.5; rx: 6px; }
      .pill-label { font: 600 12px 'JetBrains Mono', Consolas, monospace; fill: #e2e8f0; }
      .badge-bg { fill: #06281e; stroke: #10b981; stroke-width: 1.2; rx: 14px; }
      .badge-txt { font: 700 11px 'JetBrains Mono', Consolas, monospace; fill: #34d399; letter-spacing: 1.2px; }

      .cursor { animation: blink 1s step-end infinite; }
      .pulse-fast { animation: pulse 1.8s infinite ease-in-out; }
      .pulse-slow { animation: pulse 3.2s infinite ease-in-out; }
      .data-stream { stroke-dasharray: 12 180; animation: stream 4s linear infinite; }
      .data-stream-rev { stroke-dasharray: 15 220; animation: streamRev 5s linear infinite; }
      .bar-1 { animation: loadBar1 3s infinite ease-in-out; }
      .bar-2 { animation: loadBar2 4s infinite ease-in-out; }
      .bar-3 { animation: loadBar3 2.6s infinite ease-in-out; }

      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes stream { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
      @keyframes streamRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 450; } }
      @keyframes loadBar1 { 0%, 100% { width: 65px; } 50% { width: 115px; } }
      @keyframes loadBar2 { 0%, 100% { width: 95px; } 50% { width: 45px; } }
      @keyframes loadBar3 { 0%, 100% { width: 80px; } 50% { width: 120px; } }
    </style>
  </defs>

  <!-- Main Background & Grid -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect width="1200" height="350" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Background Data Streams -->
  <path d="M 0 80 L 1200 80" stroke="#00E7FF" stroke-width="1.5" stroke-opacity="0.6" class="data-stream" />
  <path d="M 0 270 L 1200 270" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6" class="data-stream-rev" />
  <rect x="100" y="0" width="1000" height="3" fill="url(#lineGrad)" />
  <rect x="100" y="347" width="1000" height="3" fill="url(#lineGrad)" />

  <!-- LEFT PANEL: Animated Backend Terminal -->
  <g transform="translate(35, 50)">
    <rect width="265" height="245" rx="10" fill="#070b14" stroke="#1e293b" stroke-width="1.5" />
    <rect width="265" height="28" rx="10" fill="#0f172a" />
    <circle cx="18" cy="14" r="5" fill="#ef4444" />
    <circle cx="34" cy="14" r="5" fill="#f59e0b" />
    <circle cx="50" cy="14" r="5" fill="#10b981" />
    <text x="135" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">bash — spring-boot:run</text>

    <text x="16" y="52" class="term-text" fill="#00E7FF">$ mvn clean spring-boot:run</text>
    <text x="16" y="74" class="term-text" fill="#94a3b8">[INFO] JDK 21 LTS initialized</text>
    <text x="16" y="94" class="term-text" fill="#94a3b8">[INFO] Starting Spring Boot 3</text>
    <text x="16" y="114" class="term-text" fill="#38bdf8">[ORM]  Hibernate JPA: Connected</text>
    <text x="16" y="134" class="term-text" fill="#38bdf8">[DB]   MySQL / Postgres Pool OK</text>
    <text x="16" y="154" class="term-text" fill="#a78bfa">[SEC]  JWT Auth Filter Active</text>
    <text x="16" y="174" class="term-text" fill="#10b981">[OK]   Tomcat started :8080</text>
    <text x="16" y="200" class="term-text" fill="#00E7FF">$ git push origin feat/apache</text>
    <text x="16" y="220" class="term-text" fill="#10b981">» Status: Ready for Production</text>
    <rect x="218" y="209" width="7" height="13" fill="#00E7FF" class="cursor" />
  </g>

  <!-- CENTER PANEL: Identity, Status & Stack -->
  <g>
    <!-- Glowing HUD Brackets -->
    <path d="M 355 45 L 330 45 L 330 75" fill="none" stroke="#00E7FF" stroke-width="2.5" filter="url(#neonGlow)" />
    <path d="M 845 45 L 870 45 L 870 75" fill="none" stroke="#00E7FF" stroke-width="2.5" filter="url(#neonGlow)" />
    <path d="M 355 305 L 330 305 L 330 275" fill="none" stroke="#00E7FF" stroke-width="2.5" filter="url(#neonGlow)" />
    <path d="M 845 305 L 870 305 L 870 275" fill="none" stroke="#00E7FF" stroke-width="2.5" filter="url(#neonGlow)" />

    <!-- Top Live Status Pill -->
    <g transform="translate(445, 52)">
      <rect width="310" height="28" class="badge-bg" />
      <circle cx="18" cy="14" r="5" fill="#10b981" filter="url(#neonGlow)" class="pulse-fast" />
      <text x="162" y="18" text-anchor="middle" class="badge-txt">OPEN TO INTERNSHIPS • GSOC</text>
    </g>

    <!-- Main Name -->
    <text x="600" y="140" text-anchor="middle" class="name">
      ADITYA <tspan class="name-accent">MITRA</tspan>
    </text>

    <!-- Role Header -->
    <text x="600" y="175" text-anchor="middle" class="role">
      BACKEND ENGINEER • OPEN SOURCE • SYSTEM DESIGN
    </text>

    <!-- Value Proposition -->
    <text x="600" y="206" text-anchor="middle" class="sub">
      Architecting scalable Java + Spring Boot systems. Solving real problems.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(348, 238)">
      <rect x="0" y="0" width="76" height="30" class="pill" />
      <text x="38" y="19" text-anchor="middle" class="pill-label">Java 21</text>

      <rect x="86" y="0" width="110" height="30" class="pill" />
      <text x="141" y="19" text-anchor="middle" class="pill-label">Spring Boot</text>

      <rect x="206" y="0" width="108" height="30" class="pill" />
      <text x="260" y="19" text-anchor="middle" class="pill-label">MySQL / PG</text>

      <rect x="324" y="0" width="82" height="30" class="pill" />
      <text x="365" y="19" text-anchor="middle" class="pill-label">Docker</text>

      <rect x="416" y="0" width="88" height="30" class="pill" />
      <text x="460" y="19" text-anchor="middle" class="pill-label">REST API</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Animated Server Cluster Telemetry -->
  <g transform="translate(900, 50)">
    <rect width="265" height="245" rx="10" fill="#070b14" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="26" font-family="monospace" font-size="11" font-weight="bold" fill="#00E7FF">CLUSTER TELEMETRY // LIVE</text>
    <line x1="15" y1="36" x2="250" y2="36" stroke="#1e293b" stroke-width="1" />

    <!-- Node 01: API Gateway -->
    <g transform="translate(18, 50)">
      <rect width="228" height="52" rx="6" fill="#0f172a" stroke="#1e293b" />
      <circle cx="18" cy="20" r="5" fill="#00E7FF" filter="url(#neonGlow)" class="pulse-fast" />
      <text x="32" y="24" font-family="monospace" font-size="11" fill="#e2e8f0">NODE_01: SPRING_API</text>
      <text x="185" y="24" font-family="monospace" font-size="10" fill="#10b981">99.9%</text>
      <rect x="32" y="34" width="140" height="6" rx="3" fill="#1e293b" />
      <rect x="32" y="34" width="90" height="6" rx="3" fill="#00E7FF" class="bar-1" />
    </g>

    <!-- Node 02: Database Cluster -->
    <g transform="translate(18, 114)">
      <rect width="228" height="52" rx="6" fill="#0f172a" stroke="#1e293b" />
      <circle cx="18" cy="20" r="5" fill="#3B82F6" filter="url(#neonGlow)" class="pulse-slow" />
      <text x="32" y="24" font-family="monospace" font-size="11" fill="#e2e8f0">NODE_02: ACID_DB_POOL</text>
      <text x="185" y="24" font-family="monospace" font-size="10" fill="#38bdf8">ACTIVE</text>
      <rect x="32" y="34" width="140" height="6" rx="3" fill="#1e293b" />
      <rect x="32" y="34" width="75" height="6" rx="3" fill="#3B82F6" class="bar-2" />
    </g>

    <!-- Node 03: Docker & Open Source CI -->
    <g transform="translate(18, 178)">
      <rect width="228" height="52" rx="6" fill="#0f172a" stroke="#1e293b" />
      <circle cx="18" cy="20" r="5" fill="#8B5CF6" filter="url(#neonGlow)" class="pulse-fast" />
      <text x="32" y="24" font-family="monospace" font-size="11" fill="#e2e8f0">NODE_03: DOCKER_CI_CD</text>
      <text x="185" y="24" font-family="monospace" font-size="10" fill="#a78bfa">READY</text>
      <rect x="32" y="34" width="140" height="6" rx="3" fill="#1e293b" />
      <rect x="32" y="34" width="105" height="6" rx="3" fill="#8B5CF6" class="bar-3" />
    </g>
  </g>
</svg>