<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="borderCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="borderPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="barFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6" />
    </pattern>

    <style>
      .hdr-text { font: 800 20px 'JetBrains Mono', Consolas, monospace; fill: #ffffff; letter-spacing: 3px; }
      .card { fill: #070b14; stroke: #1e293b; stroke-width: 1.5; rx: 12px; }
      .meta { font: 700 10px 'JetBrains Mono', Consolas, monospace; letter-spacing: 1.5px; }
      .title { font: 800 18px 'Segoe UI', Roboto, sans-serif; fill: #ffffff; }
      .desc { font: 400 12px 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .bullets { font: 700 11.5px 'Segoe UI', Roboto, sans-serif; fill: #e2e8f0; }
      .bullet-desc { font: 400 11.5px 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .badge { fill: #050811; stroke: #1e293b; stroke-width: 1; rx: 5px; }
      .badge-txt { font: 600 11px 'JetBrains Mono', Consolas, monospace; fill: #e2e8f0; }
      .status-active { fill: #052e16; stroke: #10b981; stroke-width: 1; rx: 10px; }
      .status-active-txt { font: 700 9px 'JetBrains Mono', Consolas, monospace; fill: #34d399; }
      .status-dev { fill: #2e1065; stroke: #a855f7; stroke-width: 1; rx: 10px; }
      .status-dev-txt { font: 700 9px 'JetBrains Mono', Consolas, monospace; fill: #c084fc; }

      .pulse { animation: pulsing 2s infinite ease-in-out; }
      .scan { stroke-dasharray: 60 250; animation: scanning 4s linear infinite; }

      @keyframes pulsing { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes scanning { from { stroke-dashoffset: 310; } to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <!-- Outer Canvas & Dots -->
  <rect width="1180" height="580" rx="16" fill="url(#bg)" />
  <rect width="1180" height="580" rx="16" fill="url(#dotGrid)" />
  <rect x="100" y="0" width="980" height="3" fill="url(#barFlow)" />
  <rect x="100" y="577" width="980" height="3" fill="url(#barFlow)" />

  <!-- Top Showcase Header -->
  <circle cx="34" cy="34" r="4.5" fill="#00E7FF" filter="url(#neon)" class="pulse" />
  <text x="48" y="38" class="hdr-text">APPLIED AI, MACHINE LEARNING + MLOPS SUITE</text>

  <!-- ========================================================= -->
  <!-- CARD 1: SENTINEL ML (COL 1, ROW 1)                        -->
  <!-- ========================================================= -->
  <g transform="translate(24, 64)">
    <rect width="360" height="232" class="card" />
    <rect x="2" y="0" width="356" height="3" rx="1.5" fill="url(#borderCyan)" />
    <line x1="0" y1="232" x2="360" y2="232" stroke="#00E7FF" stroke-width="2.5" class="scan" />

    <text x="20" y="24" class="meta" fill="#00E7FF">01 // INTRUSION DETECTION</text>
    <g transform="translate(274, 11)">
      <rect width="68" height="18" class="status-active" />
      <circle cx="10" cy="9" r="2.5" fill="#10b981" class="pulse" />
      <text x="38" y="12" text-anchor="middle" class="status-active-txt">TOP PICK</text>
    </g>

    <text x="20" y="54" class="title">SentinelML</text>
    <text x="20" y="74" class="desc">Network intrusion detection + MLOps pipeline with</text>
    <text x="20" y="90" class="desc">imbalanced classification, drift tracking + SHAP XAI.</text>

    <circle cx="26" cy="118" r="3" fill="#00E7FF" />
    <text x="36" y="121" class="bullets">Drift + AutoML: <tspan class="bullet-desc">PSI drift checks + threshold tuning.</tspan></text>

    <circle cx="26" cy="142" r="3" fill="#00E7FF" />
    <text x="36" y="145" class="bullets">Explainability: <tspan class="bullet-desc">SHAP feature attribution on alerts.</tspan></text>

    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="68" height="24" class="badge" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="34" y="16" text-anchor="middle" class="badge-txt">XGBoost</text>

      <rect x="74" y="0" width="52" height="24" class="badge" />
      <text x="100" y="16" text-anchor="middle" class="badge-txt">SHAP</text>

      <rect x="132" y="0" width="62" height="24" class="badge" />
      <text x="163" y="16" text-anchor="middle" class="badge-txt">FastAPI</text>

      <rect x="200" y="0" width="60" height="24" class="badge" />
      <text x="230" y="16" text-anchor="middle" class="badge-txt">MLflow</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- CARD 2: FRAUDLENS (COL 2, ROW 1)                          -->
  <!-- ========================================================= -->
  <g transform="translate(410, 64)">
    <rect width="360" height="232" class="card" />
    <rect x="2" y="0" width="356" height="3" rx="1.5" fill="url(#borderPurple)" />

    <text x="20" y="24" class="meta" fill="#C084FC">02 // FINANCIAL ANOMALIES</text>
    <g transform="translate(280, 11)">
      <rect width="62" height="18" class="status-active" />
      <circle cx="10" cy="9" r="2.5" fill="#10b981" class="pulse" />
      <text x="35" y="12" text-anchor="middle" class="status-active-txt">ACTIVE</text>
    </g>

    <text x="20" y="54" class="title">FraudLens</text>
    <text x="20" y="74" class="desc">Fraud + anomaly detection engine optimizing PR-AUC,</text>
    <text x="20" y="90" class="desc">false-positive cost matrices + A/B shadow testing.</text>

    <circle cx="26" cy="118" r="3" fill="#C084FC" />
    <text x="36" y="121" class="bullets">Extreme Skew: <tspan class="bullet-desc">PR-AUC + asymmetric cost tuning.</tspan></text>

    <circle cx="26" cy="142" r="3" fill="#C084FC" />
    <text x="36" y="145" class="bullets">Shadow A/B: <tspan class="bullet-desc">Champion vs Challenger evaluation.</tspan></text>

    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="84" height="24" class="badge" stroke="#8B5CF6" stroke-opacity="0.5" />
      <text x="42" y="16" text-anchor="middle" class="badge-txt">Scikit-Learn</text>

      <rect x="90" y="0" width="58" height="24" class="badge" />
      <text x="119" y="16" text-anchor="middle" class="badge-txt">MLflow</text>

      <rect x="154" y="0" width="52" height="24" class="badge" />
      <text x="180" y="16" text-anchor="middle" class="badge-txt">Kafka</text>

      <rect x="212" y="0" width="52" height="24" class="badge" />
      <text x="238" y="16" text-anchor="middle" class="badge-txt">SHAP</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- CARD 3: PREDICTIVEOPS (COL 3, ROW 1)                      -->
  <!-- ========================================================= -->
  <g transform="translate(796, 64)">
    <rect width="360" height="232" class="card" />
    <rect x="2" y="0" width="356" height="3" rx="1.5" fill="url(#borderCyan)" />
    <line x1="0" y1="232" x2="360" y2="232" stroke="#00E7FF" stroke-width="2.5" class="scan" />

    <text x="20" y="24" class="meta" fill="#00E7FF">03 // TIME-SERIES + IOT</text>
    <g transform="translate(280, 11)">
      <rect width="62" height="18" class="status-active" />
      <circle cx="10" cy="9" r="2.5" fill="#10b981" class="pulse" />
      <text x="35" y="12" text-anchor="middle" class="status-active-txt">ACTIVE</text>
    </g>

    <text x="20" y="54" class="title">PredictiveOps</text>
    <text x="20" y="74" class="desc">Predictive maintenance + sensor anomaly baseline with</text>
    <text x="20" y="90" class="desc">rolling time-window features + temporal validation.</text>

    <circle cx="26" cy="118" r="3" fill="#38BDF8" />
    <text x="36" y="121" class="bullets">Zero Leakage: <tspan class="bullet-desc">Walk-forward temporal splitting.</tspan></text>

    <circle cx="26" cy="142" r="3" fill="#38BDF8" />
    <text x="36" y="145" class="bullets">Feature Store: <tspan class="bullet-desc">Rolling lag + sensor health monitor.</tspan></text>

    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="64" height="24" class="badge" stroke="#3B82F6" stroke-opacity="0.5" />
      <text x="32" y="16" text-anchor="middle" class="badge-txt">PyTorch</text>

      <rect x="70" y="0" width="84" height="24" class="badge" />
      <text x="112" y="16" text-anchor="middle" class="badge-txt">FeatureStore</text>

      <rect x="160" y="0" width="78" height="24" class="badge" />
      <text x="199" y="16" text-anchor="middle" class="badge-txt">Prometheus</text>

      <rect x="244" y="0" width="56" height="24" class="badge" />
      <text x="272" y="16" text-anchor="middle" class="badge-txt">Docker</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- CARD 4: CAMPUSMIND (COL 1, ROW 2 - CENTERED)              -->
  <!-- ========================================================= -->
  <g transform="translate(216, 316)">
    <rect width="360" height="232" class="card" />
    <rect x="2" y="0" width="356" height="3" rx="1.5" fill="url(#borderPurple)" />

    <text x="20" y="24" class="meta" fill="#C084FC">04 // MULTIMODAL OCR + RAG</text>
    <g transform="translate(280, 11)">
      <rect width="62" height="18" class="status-active" />
      <circle cx="10" cy="9" r="2.5" fill="#10b981" class="pulse" />
      <text x="35" y="12" text-anchor="middle" class="status-active-txt">ACTIVE</text>
    </g>

    <text x="20" y="54" class="title">CampusMind</text>
    <text x="20" y="74" class="desc">Document intelligence agent with custom NLP classifier,</text>
    <text x="20" y="90" class="desc">OCR extraction + hybrid retrieval evaluation (MRR).</text>

    <circle cx="26" cy="118" r="3" fill="#C084FC" />
    <text x="36" y="121" class="bullets">Hybrid Search: <tspan class="bullet-desc">BM25 keyword vs dense embedding QA.</tspan></text>

    <circle cx="26" cy="142" r="3" fill="#C084FC" />
    <text x="36" y="145" class="bullets">Custom NLP: <tspan class="bullet-desc">Trained document router + NER tagger.</tspan></text>

    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="64" height="24" class="badge" stroke="#8B5CF6" stroke-opacity="0.5" />
      <text x="32" y="16" text-anchor="middle" class="badge-txt">PyTorch</text>

      <rect x="70" y="0" width="82" height="24" class="badge" />
      <text x="111" y="16" text-anchor="middle" class="badge-txt">HuggingFace</text>

      <rect x="158" y="0" width="58" height="24" class="badge" />
      <text x="187" y="16" text-anchor="middle" class="badge-txt">Qdrant</text>

      <rect x="222" y="0" width="60" height="24" class="badge" />
      <text x="252" y="16" text-anchor="middle" class="badge-txt">FastAPI</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- CARD 5: AUTOML STUDIO (COL 2, ROW 2 - CENTERED)           -->
  <!-- ========================================================= -->
  <g transform="translate(604, 316)">
    <rect width="360" height="232" class="card" />
    <rect x="2" y="0" width="356" height="3" rx="1.5" fill="url(#borderCyan)" />
    <line x1="0" y1="232" x2="360" y2="232" stroke="#00E7FF" stroke-width="2.5" class="scan" />

    <text x="20" y="24" class="meta" fill="#00E7FF">05 // AUTOML ORCHESTRATOR</text>
    <g transform="translate(268, 11)">
      <rect width="74" height="18" class="status-dev" />
      <circle cx="10" cy="9" r="2.5" fill="#c084fc" class="pulse" />
      <text x="41" y="12" text-anchor="middle" class="status-dev-txt">BUILDING</text>
    </g>

    <text x="20" y="54" class="title">AutoML-Studio</text>
    <text x="20" y="74" class="desc">Tabular AutoML platform with automated task inference,</text>
    <text x="20" y="90" class="desc">leak-free preprocessing, Optuna tuning + registry.</text>

    <circle cx="26" cy="118" r="3" fill="#00E7FF" />
    <text x="36" y="121" class="bullets">Leak-Free: <tspan class="bullet-desc">Fold-isolated pipelines + multi-model CV.</tspan></text>

    <circle cx="26" cy="142" r="3" fill="#00E7FF" />
    <text x="36" y="145" class="bullets">Model Registry: <tspan class="bullet-desc">Quality gates + SHAP report export.</tspan></text>

    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="84" height="24" class="badge" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="42" y="16" text-anchor="middle" class="badge-txt">Scikit-Learn</text>

      <rect x="90" y="0" width="56" height="24" class="badge" />
      <text x="118" y="16" text-anchor="middle" class="badge-txt">Optuna</text>

      <rect x="152" y="0" width="66" height="24" class="badge" />
      <text x="185" y="16" text-anchor="middle" class="badge-txt">Streamlit</text>

      <rect x="224" y="0" width="58" height="24" class="badge" />
      <text x="253" y="16" text-anchor="middle" class="badge-txt">MLflow</text>
    </g>
  </g>
</svg>