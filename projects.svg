<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.7" />
    </pattern>

    <style>
      .card { fill: url(#bgCard); stroke: #1e293b; stroke-width: 1.8; rx: 14px; }
      .header-tag { font: 700 11px 'JetBrains Mono', Consolas, monospace; letter-spacing: 2px; }
      .proj-title { font: 800 24px 'Segoe UI', Roboto, Helvetica, sans-serif; fill: #ffffff; }
      .proj-desc { font: 400 13px 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .sec-label { font: 700 11.5px 'JetBrains Mono', Consolas, monospace; fill: #e2e8f0; letter-spacing: 1.2px; }
      .bullet-title { font: 700 12.5px 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; }
      .bullet-text { font: 400 12.5px 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .pill { fill: #090d16; stroke-width: 1.2; rx: 6px; }
      .pill-txt { font: 600 11.5px 'JetBrains Mono', Consolas, monospace; fill: #e2e8f0; }
      .status-bg-green { fill: #052e16; stroke: #10b981; stroke-width: 1; rx: 12px; }
      .status-txt-green { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #34d399; letter-spacing: 1px; }
      .status-bg-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 1; rx: 12px; }
      .status-txt-purple { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #c084fc; letter-spacing: 1px; }

      .pulse { animation: pulseAnim 2s infinite ease-in-out; }
      .scanline { stroke-dasharray: 80 450; animation: scan 5s linear infinite; }

      @keyframes pulseAnim { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes scan { from { stroke-dashoffset: 530; } to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1100" height="390" rx="16" fill="#050811" />
  <rect width="1100" height="390" rx="16" fill="url(#dotGrid)" />

  <!-- ========================================================= -->
  <!-- CARD 1: STUDENT MARKS MANAGER (LEFT)                      -->
  <!-- ========================================================= -->
  <g transform="translate(22, 20)">
    <rect width="516" height="350" class="card" />
    <!-- Top Glowing Accent Line -->
    <rect x="2" y="0" width="512" height="4" rx="2" fill="url(#cyanBorder)" />
    <line x1="0" y1="350" x2="516" y2="350" stroke="#00E7FF" stroke-width="2.5" class="scanline" />

    <!-- System Tag + Status Badge -->
    <text x="26" y="36" class="header-tag" fill="#00E7FF">SYSTEM 01 // FULL-STACK PLATFORM</text>
    <g transform="translate(382, 19)">
      <rect width="108" height="24" class="status-bg-green" />
      <circle cx="14" cy="12" r="4" fill="#10b981" class="pulse" />
      <text x="60" y="15.5" text-anchor="middle" class="status-txt-green">PRODUCTION</text>
    </g>

    <!-- Project Title & Subtitle -->
    <text x="26" y="72" class="proj-title">Student Marks Manager</text>
    <text x="26" y="96" class="proj-desc">Full-stack academic record management platform for student</text>
    <text x="26" y="114" class="proj-desc">CRUD workflows, automated CGPA computation, and analytics.</text>

    <line x1="26" y1="130" x2="490" y2="130" stroke="#1e293b" stroke-width="1" />

    <!-- Engineering Highlights -->
    <text x="26" y="152" class="sec-label">ENGINEERING HIGHLIGHTS</text>

    <circle cx="32" cy="175" r="3.5" fill="#00E7FF" />
    <text x="44" y="179" class="bullet-title">Layered Architecture: <tspan class="bullet-text">Controller-Service-Repository in Spring Boot.</tspan></text>

    <circle cx="32" cy="201" r="3.5" fill="#00E7FF" />
    <text x="44" y="205" class="bullet-title">Academic Analytics: <tspan class="bullet-text">Automated grade-point and CGPA engine.</tspan></text>

    <circle cx="32" cy="227" r="3.5" fill="#00E7FF" />
    <text x="44" y="231" class="bullet-title">Database Integration: <tspan class="bullet-text">Persistent student document storage in MongoDB.</tspan></text>

    <circle cx="32" cy="253" r="3.5" fill="#00E7FF" />
    <text x="44" y="257" class="bullet-title">Dashboard UI: <tspan class="bullet-text">Responsive frontend interface for academic tracking.</tspan></text>

    <!-- Tech Stack Pills -->
    <text x="26" y="288" class="sec-label" fill="#00E7FF">TECH STACK</text>
    <g transform="translate(26, 298)">
      <rect x="0" y="0" width="58" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="29" y="18" text-anchor="middle" class="pill-txt">Java</text>

      <rect x="66" y="0" width="98" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="115" y="18" text-anchor="middle" class="pill-txt">Spring Boot</text>

      <rect x="172" y="0" width="76" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="210" y="18" text-anchor="middle" class="pill-txt">MongoDB</text>

      <rect x="256" y="0" width="78" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="295" y="18" text-anchor="middle" class="pill-txt">REST API</text>

      <rect x="342" y="0" width="145" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="414" y="18" text-anchor="middle" class="pill-txt">HTML • CSS • JS</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- CARD 2: METADATA EXTRACTOR (RIGHT)                        -->
  <!-- ========================================================= -->
  <g transform="translate(562, 20)">
    <rect width="516" height="350" class="card" />
    <!-- Top Glowing Accent Line -->
    <rect x="2" y="0" width="512" height="4" rx="2" fill="url(#purpleBorder)" />
    <line x1="0" y1="350" x2="516" y2="350" stroke="#A855F7" stroke-width="2.5" class="scanline" />

    <!-- System Tag + Status Badge -->
    <text x="26" y="36" class="header-tag" fill="#C084FC">SYSTEM 02 // FILE PARSING ENGINE</text>
    <g transform="translate(382, 19)">
      <rect width="108" height="24" class="status-bg-purple" />
      <circle cx="14" cy="12" r="4" fill="#c084fc" class="pulse" />
      <text x="60" y="15.5" text-anchor="middle" class="status-txt-purple">ACTIVE DEV</text>
    </g>

    <!-- Project Title & Subtitle -->
    <text x="26" y="72" class="proj-title">Metadata Extractor</text>
    <text x="26" y="96" class="proj-desc">Backend service and utility engineered for deep file inspection,</text>
    <text x="26" y="114" class="proj-desc">automated metadata parsing, indexing, and structured extraction.</text>

    <line x1="26" y1="130" x2="490" y2="130" stroke="#1e293b" stroke-width="1" />

    <!-- Engineering Highlights -->
    <text x="26" y="152" class="sec-label">ENGINEERING HIGHLIGHTS</text>

    <circle cx="32" cy="175" r="3.5" fill="#C084FC" />
    <text x="44" y="179" class="bullet-title">Deep File Inspection: <tspan class="bullet-text">Automated extraction of EXIF, document, and media properties.</tspan></text>

    <circle cx="32" cy="201" r="3.5" fill="#C084FC" />
    <text x="44" y="205" class="bullet-title">Structured Serialization: <tspan class="bullet-text">Transforms raw binary headers into clean JSON schemas.</tspan></text>

    <circle cx="32" cy="227" r="3.5" fill="#C084FC" />
    <text x="44" y="231" class="bullet-title">High-Throughput Parsing: <tspan class="bullet-text">Stream-based processing with strict validation.</tspan></text>

    <circle cx="32" cy="253" r="3.5" fill="#C084FC" />
    <text x="44" y="257" class="bullet-title">Modular Integration: <tspan class="bullet-text">Clean API design ready for cloud storage pipelines.</tspan></text>

    <!-- Tech Stack Pills -->
    <text x="26" y="288" class="sec-label" fill="#C084FC">TECH STACK</text>
    <g transform="translate(26, 298)">
      <rect x="0" y="0" width="58" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="29" y="18" text-anchor="middle" class="pill-txt">Java</text>

      <rect x="66" y="0" width="98" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="115" y="18" text-anchor="middle" class="pill-txt">Spring Boot</text>

      <rect x="172" y="0" width="84" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="214" y="18" text-anchor="middle" class="pill-txt">File I/O</text>

      <rect x="264" y="0" width="82" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="305" y="18" text-anchor="middle" class="pill-txt">REST API</text>

      <rect x="354" y="0" width="110" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="409" y="18" text-anchor="middle" class="pill-txt">JSON / Maven</text>
    </g>
  </g>
</svg>