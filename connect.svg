<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgConnect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1124" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="topAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .outer { fill: url(#bgConnect); stroke: #1e293b; stroke-width: 1.8; rx: 16px; }
      .box { fill: #070b14; stroke: #1e293b; stroke-width: 1.4; rx: 10px; }
      .tag { font: 700 11.5px 'JetBrains Mono', Consolas, monospace; fill: #00E7FF; letter-spacing: 2px; }
      .title { font: 800 24px 'Segoe UI', Roboto, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .box-hdr { font: 700 12px 'JetBrains Mono', Consolas, monospace; letter-spacing: 1.2px; }
      .box-sub { font: 400 12.5px 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .term-bar { fill: #090d16; stroke: #1e293b; stroke-width: 1.2; rx: 8px; }
      .term-txt { font: 600 12px 'JetBrains Mono', Consolas, monospace; }
      .badge-bg { fill: #052e16; stroke: #10b981; stroke-width: 1.2; rx: 13px; }
      .badge-txt { font: 700 10.5px 'JetBrains Mono', Consolas, monospace; fill: #34d399; letter-spacing: 1.2px; }

      .pulse { animation: pulseAnim 2s infinite ease-in-out; }
      .cursor { animation: blink 1s step-end infinite; }
      .stream { stroke-dasharray: 60 400; animation: moveLine 5s linear infinite; }

      @keyframes pulseAnim { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes moveLine { from { stroke-dashoffset: 460; } to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <!-- Main Card Background -->
  <rect width="1100" height="250" class="outer" />
  <rect x="2" y="0" width="1096" height="4" rx="2" fill="url(#topAccent)" />
  <line x1="0" y1="249" x2="1100" y2="249" stroke="#00E7FF" stroke-width="2" class="stream" />

  <!-- Top Header + Live Availability Pill -->
  <circle cx="34" cy="34" r="4.5" fill="#00E7FF" filter="url(#glow)" class="pulse" />
  <text x="48" y="38" class="tag">TRANSMISSION CHANNEL // OPEN FOR COLLABORATION</text>

  <g transform="translate(805, 18)">
    <rect width="265" height="26" class="badge-bg" />
    <circle cx="16" cy="13" r="4" fill="#10b981" class="pulse" />
    <text x="140" y="16.5" text-anchor="middle" class="badge-txt">STATUS: AVAILABLE TO HIRE</text>
  </g>

  <text x="30" y="72" class="title">Let's Architect Scalable Systems Together</text>

  <!-- 3 Collaboration Pillar Cards -->
  <!-- Card 1 -->
  <g transform="translate(30, 92)">
    <rect width="332" height="86" class="box" stroke="#00E7FF" stroke-opacity="0.5" />
    <rect x="0" y="0" width="4" height="86" rx="2" fill="#00E7FF" />
    <text x="18" y="26" class="box-hdr" fill="#00E7FF">01 // BACKEND INTERNSHIPS</text>
    <text x="18" y="48" class="box-sub">Java 21 • Spring Boot 3 • REST APIs</text>
    <text x="18" y="68" class="box-sub">MySQL / PostgreSQL • Docker • Linux</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(384, 92)">
    <rect width="332" height="86" class="box" stroke="#8B5CF6" stroke-opacity="0.5" />
    <rect x="0" y="0" width="4" height="86" rx="2" fill="#8B5CF6" />
    <text x="18" y="26" class="box-hdr" fill="#C084FC">02 // OPEN SOURCE + GSOC '27</text>
    <text x="18" y="48" class="box-sub">Apache Grails • Enterprise Java Repos</text>
    <text x="18" y="68" class="box-sub">Bug Fixes • Issue Triage • Clean PRs</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(738, 92)">
    <rect width="332" height="86" class="box" stroke="#10B981" stroke-opacity="0.5" />
    <rect x="0" y="0" width="4" height="86" rx="2" fill="#10B981" />
    <text x="18" y="26" class="box-hdr" fill="#34D399">03 // TECH DISCUSSIONS</text>
    <text x="18" y="48" class="box-sub">System Design • Distributed Systems</text>
    <text x="18" y="68" class="box-sub">Data Structures + Algorithms in Java</text>
  </g>

  <!-- Bottom Terminal Command Bar -->
  <g transform="translate(30, 194)">
    <rect width="1040" height="36" class="term-bar" />
    <text x="18" y="23" class="term-txt" fill="#00E7FF">$ ping aditya.mitra --connect</text>
    <text x="260" y="23" class="term-txt" fill="#64748b">»</text>
    <text x="280" y="23" class="term-txt" fill="#10b981">[200 OK] Ready for Backend Roles, Open Source PRs + Tech Chats</text>
    <rect x="785" y="11" width="8" height="15" fill="#00E7FF" class="cursor" />
  </g>
</svg>