<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.7" />
    </pattern>
    <style>
      .card { fill: url(#bgCard); stroke: #1e293b; stroke-width: 1.8; rx: 14px; }
      .header-tag { font: 700 11px 'JetBrains Mono', Consolas, monospace; letter-spacing: 2px; }
      .proj-title { font: 800 24px 'Segoe UI', Roboto, Helvetica, sans-serif; fill: #ffffff; }
      .proj-desc { font: 400 13px 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .sec-label { font: 700 11.5px 'JetBrains Mono', Consolas, monospace; fill: #e2e8f0; letter-spacing: 1.2px; }
      .bullet-title { font: 700 12.5px 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; }
      .bullet-text { font: 400 12.5px 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .pill { fill: #090d16; stroke-width: 1.2; rx: 6px; }
      .pill-txt { font: 600 11.5px 'JetBrains Mono', Consolas, monospace; fill: #e2e8f0; }
      .status-bg-green { fill: #052e16; stroke: #10b981; stroke-width: 1; rx: 12px; }
      .status-txt-green { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #34d399; letter-spacing: 1px; }
      .status-bg-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 1; rx: 12px; }
      .status-txt-purple { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #c084fc; letter-spacing: 1px; }
      .pulse { animation: pulseAnim 2s infinite ease-in-out; }
      .scanline { stroke-dasharray: 80 450; animation: scan 5s linear infinite; }
      @keyframes pulseAnim { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes scan { from { stroke-dashoffset: 530; } to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1100" height="390" rx="16" fill="#050811" />
  <rect width="1100" height="390" rx="16" fill="url(#dotGrid)" />

  <!-- CARD 3: PREDICTIVE OPS (LEFT) -->
  <g transform="translate(22, 20)">
    <rect width="516" height="350" class="card" />
    <rect x="2" y="0" width="512" height="4" rx="2" fill="url(#cyanBorder)" />
    <line x1="0" y1="350" x2="516" y2="350" stroke="#00E7FF" stroke-width="2.5" class="scanline" />

    <text x="26" y="36" class="header-tag" fill="#00E7FF">MLOPS 03 // TIME-SERIES + IOT</text>
    <g transform="translate(382, 19)">
      <rect width="108" height="24" class="status-bg-green" />
      <circle cx="14" cy="12" r="4" fill="#10b981" class="pulse" />
      <text x="60" y="15.5" text-anchor="middle" class="status-txt-green">ACTIVE DEV</text>
    </g>

    <text x="26" y="72" class="proj-title">PredictiveOps</text>
    <text x="26" y="96" class="proj-desc">Industrial time-series predictive maintenance and IoT sensor</text>
    <text x="26" y="114" class="proj-desc">anomaly engine with rolling-window features and zero leakage.</text>

    <line x1="26" y1="130" x2="490" y2="130" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="152" class="sec-label">ENGINEERING HIGHLIGHTS</text>

    <circle cx="32" cy="175" r="3.5" fill="#00E7FF" />
    <text x="44" y="179" class="bullet-title">Rolling Windows: <tspan class="bullet-text">Multi-horizon lag, EMA, and volatility features.</tspan></text>

    <circle cx="32" cy="201" r="3.5" fill="#00E7FF" />
    <text x="44" y="205" class="bullet-title">Temporal Validation: <tspan class="bullet-text">Walk-forward splitting prevents future leakage.</tspan></text>

    <circle cx="32" cy="227" r="3.5" fill="#00E7FF" />
    <text x="44" y="231" class="bullet-title">Feature Store: <tspan class="bullet-text">Point-in-time feature serving for training parity.</tspan></text>

    <circle cx="32" cy="253" r="3.5" fill="#00E7FF" />
    <text x="44" y="257" class="bullet-title">Sensor Baselines: <tspan class="bullet-text">Hybrid anomaly scoring + Prometheus alerts.</tspan></text>

    <text x="26" y="288" class="sec-label" fill="#00E7FF">TECH STACK</text>
    <g transform="translate(26, 298)">
      <rect x="0" y="0" width="74" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="37" y="18" text-anchor="middle" class="pill-txt">PyTorch</text>

      <rect x="82" y="0" width="102" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="133" y="18" text-anchor="middle" class="pill-txt">FeatureStore</text>

      <rect x="192" y="0" width="96" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="240" y="18" text-anchor="middle" class="pill-txt">Prometheus</text>

      <rect x="296" y="0" width="72" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="332" y="18" text-anchor="middle" class="pill-txt">Docker</text>

      <rect x="376" y="0" width="88" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="420" y="18" text-anchor="middle" class="pill-txt">TimeSeries</text>
    </g>
  </g>

  <!-- CARD 4: CAMPUS MIND (RIGHT) -->
  <g transform="translate(562, 20)">
    <rect width="516" height="350" class="card" />
    <rect x="2" y="0" width="512" height="4" rx="2" fill="url(#purpleBorder)" />
    <line x1="0" y1="350" x2="516" y2="350" stroke="#A855F7" stroke-width="2.5" class="scanline" />

    <text x="26" y="36" class="header-tag" fill="#C084FC">MLOPS 04 // MULTIMODAL OCR + RAG</text>
    <g transform="translate(382, 19)">
      <rect width="108" height="24" class="status-bg-purple" />
      <circle cx="14" cy="12" r="4" fill="#c084fc" class="pulse" />
      <text x="60" y="15.5" text-anchor="middle" class="status-txt-purple">ACTIVE DEV</text>
    </g>

    <text x="26" y="72" class="proj-title">CampusMind</text>
    <text x="26" y="96" class="proj-desc">Multimodal OCR and Hybrid RAG document intelligence agent with</text>
    <text x="26" y="114" class="proj-desc">a custom NLP document classifier and retrieval benchmarking.</text>

    <line x1="26" y1="130" x2="490" y2="130" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="152" class="sec-label">ENGINEERING HIGHLIGHTS</text>

    <circle cx="32" cy="175" r="3.5" fill="#C084FC" />
    <text x="44" y="179" class="bullet-title">Custom NLP Router: <tspan class="bullet-text">Trained document classifier + entity extractor.</tspan></text>

    <circle cx="32" cy="201" r="3.5" fill="#C084FC" />
    <text x="44" y="205" class="bullet-title">Hybrid Retrieval: <tspan class="bullet-text">BM25 keyword vs dense embedding search fusion.</tspan></text>

    <circle cx="32" cy="227" r="3.5" fill="#C084FC" />
    <text x="44" y="231" class="bullet-title">Quantitative Eval: <tspan class="bullet-text">Benchmarked on Recall@K, MRR, and NDCG.</tspan></text>

    <circle cx="32" cy="253" r="3.5" fill="#C084FC" />
    <text x="44" y="257" class="bullet-title">Multimodal OCR: <tspan class="bullet-text">Layout-aware PDF parsing with grounded citations.</tspan></text>

    <text x="26" y="288" class="sec-label" fill="#C084FC">TECH STACK</text>
    <g transform="translate(26, 298)">
      <rect x="0" y="0" width="74" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="37" y="18" text-anchor="middle" class="pill-txt">PyTorch</text>

      <rect x="82" y="0" width="98" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="131" y="18" text-anchor="middle" class="pill-txt">HuggingFace</text>

      <rect x="188" y="0" width="72" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="224" y="18" text-anchor="middle" class="pill-txt">Qdrant</text>

      <rect x="268" y="0" width="76" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="306" y="18" text-anchor="middle" class="pill-txt">FastAPI</text>

      <rect x="352" y="0" width="112" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="408" y="18" text-anchor="middle" class="pill-txt">OCR • Hybrid</text>
    </g>
  </g>
</svg>