<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E7FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.7" />
    </pattern>
    <style>
      .card { fill: url(#bgCard); stroke: #1e293b; stroke-width: 1.8; rx: 14px; }
      .header-tag { font: 700 11px 'JetBrains Mono', Consolas, monospace; letter-spacing: 2px; }
      .proj-title { font: 800 24px 'Segoe UI', Roboto, Helvetica, sans-serif; fill: #ffffff; }
      .proj-desc { font: 400 13px 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .sec-label { font: 700 11.5px 'JetBrains Mono', Consolas, monospace; fill: #e2e8f0; letter-spacing: 1.2px; }
      .bullet-title { font: 700 12.5px 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; }
      .bullet-text { font: 400 12.5px 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .pill { fill: #090d16; stroke-width: 1.2; rx: 6px; }
      .pill-txt { font: 600 11.5px 'JetBrains Mono', Consolas, monospace; fill: #e2e8f0; }
      .status-bg-green { fill: #052e16; stroke: #10b981; stroke-width: 1; rx: 12px; }
      .status-txt-green { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #34d399; letter-spacing: 1px; }
      .status-bg-purple { fill: #2e1065; stroke: #a855f7; stroke-width: 1; rx: 12px; }
      .status-txt-purple { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #c084fc; letter-spacing: 1px; }
      .pulse { animation: pulseAnim 2s infinite ease-in-out; }
      .scanline { stroke-dasharray: 80 450; animation: scan 5s linear infinite; }
      @keyframes pulseAnim { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes scan { from { stroke-dashoffset: 530; } to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1100" height="390" rx="16" fill="#050811" />
  <rect width="1100" height="390" rx="16" fill="url(#dotGrid)" />

  <!-- CARD 1: SENTINEL ML (LEFT) -->
  <g transform="translate(22, 20)">
    <rect width="516" height="350" class="card" />
    <rect x="2" y="0" width="512" height="4" rx="2" fill="url(#cyanBorder)" />
    <line x1="0" y1="350" x2="516" y2="350" stroke="#00E7FF" stroke-width="2.5" class="scanline" />

    <text x="26" y="36" class="header-tag" fill="#00E7FF">MLOPS 01 // INTRUSION DETECTION</text>
    <g transform="translate(382, 19)">
      <rect width="108" height="24" class="status-bg-green" />
      <circle cx="14" cy="12" r="4" fill="#10b981" class="pulse" />
      <text x="60" y="15.5" text-anchor="middle" class="status-txt-green">TOP PICK</text>
    </g>

    <text x="26" y="72" class="proj-title">SentinelML</text>
    <text x="26" y="96" class="proj-desc">End-to-end network intrusion detection and MLOps pipeline with</text>
    <text x="26" y="114" class="proj-desc">imbalanced classification, drift monitoring, and SHAP explainability.</text>

    <line x1="26" y1="130" x2="490" y2="130" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="152" class="sec-label">ENGINEERING HIGHLIGHTS</text>

    <circle cx="32" cy="175" r="3.5" fill="#00E7FF" />
    <text x="44" y="179" class="bullet-title">Imbalanced ML: <tspan class="bullet-text">Class-weighted XGBoost + precision-recall tuning.</tspan></text>

    <circle cx="32" cy="201" r="3.5" fill="#00E7FF" />
    <text x="44" y="205" class="bullet-title">Explainable AI: <tspan class="bullet-text">Local and global SHAP feature attribution on alerts.</tspan></text>

    <circle cx="32" cy="227" r="3.5" fill="#00E7FF" />
    <text x="44" y="231" class="bullet-title">Drift Telemetry: <tspan class="bullet-text">Automated PSI + KS-test feature drift tracking.</tspan></text>

    <circle cx="32" cy="253" r="3.5" fill="#00E7FF" />
    <text x="44" y="257" class="bullet-title">Backend Serving: <tspan class="bullet-text">Low-latency FastAPI inference + Docker packaging.</tspan></text>

    <text x="26" y="288" class="sec-label" fill="#00E7FF">TECH STACK</text>
    <g transform="translate(26, 298)">
      <rect x="0" y="0" width="76" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="38" y="18" text-anchor="middle" class="pill-txt">XGBoost</text>

      <rect x="84" y="0" width="66" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="117" y="18" text-anchor="middle" class="pill-txt">SHAP</text>

      <rect x="158" y="0" width="76" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="196" y="18" text-anchor="middle" class="pill-txt">FastAPI</text>

      <rect x="242" y="0" width="76" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="280" y="18" text-anchor="middle" class="pill-txt">MLflow</text>

      <rect x="326" y="0" width="138" height="28" class="pill" stroke="#00E7FF" stroke-opacity="0.5" />
      <text x="395" y="18" text-anchor="middle" class="pill-txt">Python • Docker</text>
    </g>
  </g>

  <!-- CARD 2: FRAUDLENS (RIGHT) -->
  <g transform="translate(562, 20)">
    <rect width="516" height="350" class="card" />
    <rect x="2" y="0" width="512" height="4" rx="2" fill="url(#purpleBorder)" />
    <line x1="0" y1="350" x2="516" y2="350" stroke="#A855F7" stroke-width="2.5" class="scanline" />

    <text x="26" y="36" class="header-tag" fill="#C084FC">MLOPS 02 // FINANCIAL ANOMALIES</text>
    <g transform="translate(382, 19)">
      <rect width="108" height="24" class="status-bg-purple" />
      <circle cx="14" cy="12" r="4" fill="#c084fc" class="pulse" />
      <text x="60" y="15.5" text-anchor="middle" class="status-txt-purple">ACTIVE DEV</text>
    </g>

    <text x="26" y="72" class="proj-title">FraudLens</text>
    <text x="26" y="96" class="proj-desc">Financial transaction fraud and anomaly detection platform</text>
    <text x="26" y="114" class="proj-desc">optimizing PR-AUC, cost-sensitive thresholds, and A/B testing.</text>

    <line x1="26" y1="130" x2="490" y2="130" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="152" class="sec-label">ENGINEERING HIGHLIGHTS</text>

    <circle cx="32" cy="175" r="3.5" fill="#C084FC" />
    <text x="44" y="179" class="bullet-title">Extreme Class Skew: <tspan class="bullet-text">Optimizes PR-AUC and Recall at fixed FPR.</tspan></text>

    <circle cx="32" cy="201" r="3.5" fill="#C084FC" />
    <text x="44" y="205" class="bullet-title">Cost-Matrix Tuning: <tspan class="bullet-text">Balances false declines against missed fraud.</tspan></text>

    <circle cx="32" cy="227" r="3.5" fill="#C084FC" />
    <text x="44" y="231" class="bullet-title">Shadow A/B Router: <tspan class="bullet-text">Champion vs Challenger model evaluation.</tspan></text>

    <circle cx="32" cy="253" r="3.5" fill="#C084FC" />
    <text x="44" y="257" class="bullet-title">Reason Codes: <tspan class="bullet-text">SHAP-backed rejection explanations for audits.</tspan></text>

    <text x="26" y="288" class="sec-label" fill="#C084FC">TECH STACK</text>
    <g transform="translate(26, 298)">
      <rect x="0" y="0" width="96" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="48" y="18" text-anchor="middle" class="pill-txt">Scikit-Learn</text>

      <rect x="104" y="0" width="76" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="142" y="18" text-anchor="middle" class="pill-txt">LightGBM</text>

      <rect x="188" y="0" width="72" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="224" y="18" text-anchor="middle" class="pill-txt">MLflow</text>

      <rect x="268" y="0" width="66" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="301" y="18" text-anchor="middle" class="pill-txt">Kafka</text>

      <rect x="342" y="0" width="122" height="28" class="pill" stroke="#A855F7" stroke-opacity="0.5" />
      <text x="403" y="18" text-anchor="middle" class="pill-txt">SHAP • FastAPI</text>
    </g>
  </g>
</svg>